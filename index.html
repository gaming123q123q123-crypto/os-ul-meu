<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NovaOS</title>
<style>
:root{--acc:#3e91ff;--r:50%;--bg:#16181d;--fg:#f2f4f8;--card:#242730;--mut:#8b91a0}
.light{--bg:#f2f3f7;--fg:#14161a;--card:#fff;--mut:#6b7180}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:#0a0b0e;font-family:"Segoe UI",Roboto,system-ui,sans-serif;color:var(--fg)}
body{display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:390px;height:min(820px,100vh);border-radius:44px;overflow:hidden;background:#000 center/cover;box-shadow:0 0 0 10px #1c1e24,0 30px 80px #000a}

.layer{position:absolute;inset:0;transition:transform .35s ease,opacity .3s}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:99;opacity:0}
#status{position:absolute;top:0;left:0;right:0;height:34px;padding:8px 22px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:600;z-index:60;color:#fff;text-shadow:0 1px 3px #0008}

#lock{overflow:hidden;z-index:40;color:#fff;text-align:center;background:linear-gradient(#0004,#0007)}

#lock .h{position:absolute;bottom:34px;left:0;right:0;font-size:14px;opacity:.85}

#pinbox.on{transform:none}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 18px}.dots i{width:12px;height:12px;border-radius:50%;border:2px solid #fff}.dots i.f{background:#fff}

#home.hide{transform:scale(.92);opacity:0}
.wid{margin:10px 6px 24px}.wid .t{font-size:60px;font-weight:300;line-height:1}.wid .d{font-size:16px;opacity:.9;margin-top:4px}
.grid{flex:1;min-height:0;overflow:auto;align-content:start;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:20px 6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer;text-shadow:0 1px 3px #0009}
.ic div{width:var(--isz,58px);height:var(--isz,58px);border-radius:var(--r);display:grid;place-items:center;font-size:calc(var(--isz,58px)*.48);box-shadow:0 4px 12px #0005;transition:transform .15s}
.ic:active div{transform:scale(.88)}

#nav{position:absolute;bottom:0;left:0;right:0;height:56px;z-index:70;display:flex;justify-content:space-evenly;align-items:center;color:#fff;font-size:20px;background:linear-gradient(transparent,#0008)}
#nav b{padding:10px 24px;cursor:pointer;font-weight:400}
.app{position:absolute;inset:0;z-index:30;background:var(--bg);color:var(--fg);padding-top:34px;display:flex;flex-direction:column;animation:op .25s ease}
@keyframes op{from{transform:scale(.7);opacity:0;border-radius:40px}}
.app h2{font-size:26px;font-weight:600;padding:16px 22px 10px}
.body{flex:1;overflow:auto;padding:0 16px 70px}
.card{background:var(--card);border-radius:22px;padding:6px 16px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #8883;gap:10px;font-size:15px}.row:last-child{border:0}
.row small{display:block;color:var(--mut);font-size:12px}
.sw{width:46px;height:26px;border-radius:13px;background:#8886;position:relative;cursor:pointer;flex:none;transition:.2s}.sw.on{background:var(--acc)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on:after{left:23px}
.chips{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0}
.chips i{width:44px;height:44px;border-radius:50%;cursor:pointer;border:3px solid transparent;background-size:cover}.chips i.s{border-color:var(--fg)}
.chips.w i{width:54px;height:80px;border-radius:12px}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:16px;padding:10px 18px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--acc)}
#qs{position:absolute;inset:0 0 auto;z-index:80;padding:44px 16px 18px;background:#000d;backdrop-filter:blur(24px);color:#fff;transform:translateY(-105%);transition:.3s;border-radius:0 0 30px 30px}
#qs.on{transform:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;cursor:pointer}.tile div{width:100%;aspect-ratio:1;border-radius:50%;background:#fff2;display:grid;place-items:center;font-size:22px}.tile.on div{background:var(--acc)}
#toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;z-index:95;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calc b{padding:18px 0;text-align:center;border-radius:50%;background:var(--card);font-size:22px;font-weight:400;cursor:pointer}.calc b.o{background:var(--acc);color:#fff}
.out{text-align:right;font-size:52px;font-weight:300;padding:30px 8px 14px;min-height:110px;overflow:hidden;word-break:break-all}
textarea{width:100%;height:100%;background:var(--card);border:0;border-radius:20px;padding:16px;resize:none;outline:0;font-size:16px}
iframe{flex:1;border:0;background:#fff;width:100%}
.piano{display:flex;gap:6px;height:300px}.piano b{flex:1;background:#fff;color:#222;border-radius:0 0 12px 12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;cursor:pointer}.piano b:active{background:var(--acc);color:#fff}
.nl .ic span{display:none}.grid::-webkit-scrollbar{display:none}
#lock.lk1 .t{font-weight:800;letter-spacing:-4px}#lock.lk2 .t{font-size:112px;line-height:.88;margin-top:90px;font-weight:600}#lock.lp1 .t{margin-top:230px}#lock.lp2 .t{margin-top:320px}#lock.lk2.lp1 .t{margin-top:200px}#lock.lk2.lp2 .t{margin-top:290px}
.pk1 .ic div{background:#2f3340!important}.pk2 .ic div{background:#0b0c10!important;box-shadow:0 0 14px var(--acc),inset 0 0 0 2px var(--acc)}.pk3 .ic div{background:#ffffff40!important;backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px #fff6}.pk4 .ic div{background:#fff!important}
.wc1 .wid .t{font-weight:700;letter-spacing:-3px;font-size:72px}.wc1 .wid .d{color:var(--acc);font-weight:700;filter:brightness(1.4)}
.an1 .app{animation:su .32s cubic-bezier(.2,.9,.3,1)}.an2 .app{animation:fi .25s}.an3 .app{animation:none}@keyframes su{from{transform:translateY(100%)}}@keyframes fi{from{opacity:0}}
.app.out{pointer-events:none;animation:cl0 .23s ease forwards}.an1 .app.out{animation:cl1 .23s ease forwards}.an2 .app.out{animation:cl2 .2s forwards}.an3 .app.out{display:none}@keyframes cl0{to{transform:scale(.7);opacity:0;border-radius:40px}}@keyframes cl1{to{transform:translateY(100%)}}@keyframes cl2{to{opacity:0}}
#pill{transition:width .2s}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
.ic div{position:relative;overflow:hidden;text-shadow:0 2px 3px #0005}.ic div:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#ffffff45,#ffffff00 52%,#00000030);pointer-events:none}
#home .dock{background:var(--dk,#ffffff33)!important;backdrop-filter:blur(var(--db,18px))!important}
#wg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 6px 14px}#wg:empty{display:none}.wc{background:#0006;backdrop-filter:blur(12px);border-radius:22px;padding:12px 14px;font-size:13px;min-height:66px;display:flex;flex-direction:column;justify-content:center;gap:2px}.wc b{font-size:22px;font-weight:600}
.bt{display:inline-block;width:22px;height:11px;border:1.5px solid #fffd;border-radius:3px;padding:1px;vertical-align:-1px}.bt i{display:block;height:100%;border-radius:1px}
#home .grid{display:block!important;overflow:hidden!important;touch-action:pan-y}.pgs{display:flex;height:100%;transition:transform .38s cubic-bezier(.2,.9,.3,1)}.pg{flex:none;width:100%;display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:20px 6px;align-content:start}
#dots2{display:flex;gap:7px;justify-content:center;margin:8px 0 0;min-height:8px}#dots2 i{width:7px;height:7px;border-radius:50%;background:#fff6;transition:.3s}#dots2 i.a{background:#fff;width:18px;border-radius:4px}
.gz{display:none}#gzt{display:block}.gst .gz{display:block}#pill{display:none;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:3px;background:#fffd;z-index:71;pointer-events:none}.gst #pill{display:block}.gst #nav{display:none}
#rc{position:absolute;inset:0;z-index:50;background:#000b;backdrop-filter:blur(16px);display:none;flex-direction:column;justify-content:center;padding:50px 0 70px}#rc.on{display:flex}
.rcl{display:flex;gap:16px;overflow-x:auto;padding:0 40px;height:60%}.rcc{flex:none;width:190px;border-radius:26px;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;cursor:pointer}
#nowbar{position:absolute;left:24px;right:24px;bottom:70px;height:56px;border-radius:28px;background:#000c;backdrop-filter:blur(14px);display:none;align-items:center;gap:12px;padding:0 20px;font-size:14px;cursor:pointer;text-align:left}#nowbar.on{display:flex}
#nowbar .p{position:absolute;left:22px;right:22px;bottom:6px;height:3px;border-radius:2px;background:#fff3}#nowbar .p i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.eq{display:flex;gap:2px;align-items:flex-end;height:18px}.eq i{width:3px;background:var(--acc);animation:eq .6s infinite alternate}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}@keyframes eq{from{height:4px}to{height:18px}}
#kb{position:absolute;left:0;right:0;bottom:56px;z-index:75;background:var(--bg);color:var(--fg);padding:8px 6px 2px;display:none;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px #0006}#kb.on{display:block}
#kb div{display:flex;gap:5px;margin-bottom:6px;justify-content:center}#kb b{flex:1;max-width:40px;height:40px;border-radius:9px;background:var(--card);display:grid;place-items:center;font-weight:400;cursor:pointer;font-size:16px}#kb b.w{max-width:none;flex:1.5}#kb b.sp{flex:5;max-width:none}
.kbon .body{padding-bottom:310px!important}
.mc{display:flex;align-items:center;justify-content:space-between;background:#fff2;border-radius:20px;padding:10px 16px;margin-top:12px;font-size:14px}.mc b{padding:0 8px;cursor:pointer;font-size:20px;font-weight:400}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{padding:10px 0;border-radius:50%;font-weight:400;font-size:14px}.cal b.t{background:var(--acc);color:#fff}
canvas{background:#fff;border-radius:16px;width:100%;touch-action:none}

<div id="phone">
<div id="status"><span id="sc">12:00</span><span><span id="sw">📶</span><span id="sb">🔋</span></span></div>
<div id="home" class="layer"><div class="wid"><div class="t" id="hc"></div><div class="d" id="hd"></div></div><div id="wg"></div><div class="grid" id="grid"></div><div id="dots2"></div><div class="dock" id="dock"></div></div>
<div id="lock" class="layer"><div class="t" id="lc"></div><div class="d" id="ld"></div><div id="lw" style="margin-top:14px;font-size:15px"></div><div class="h">Atinge pentru a debloca</div><div id="nowbar"><div class="eq"><i></i><i></i><i></i></div><div id="nwt" style="flex:1"></div><span>⏸</span><div class="p"><i id="nwp" style="width:0"></i></div></div>
<div id="pinbox"><div class="dots" id="dots"></div><div class="keys" id="keys"></div><div id="fp" style="text-align:center;margin-top:16px;font-size:13px;opacity:.8;cursor:pointer">Ai uitat PIN-ul? Șterge PIN-ul</div></div></div>
<div id="qs"><div class="tiles" id="tiles"></div><div style="font-size:12px;margin-bottom:4px">☀️ Luminozitate</div><input type="range" id="br" min="30" max="100"><div style="font-size:12px;margin:10px 0 4px">🔊 Volum</div><input type="range" id="vo" min="0" max="100"><div class="mc"><span id="mt"></span><span><b id="mpv">⏮</b><b id="mpp">▶</b><b id="mpn">⏭</b></span></div></div>

<div id="rc"></div><div id="pill"></div><div id="kb"></div><div id="toast"></div><div id="dim"></div>
</div>
<script>
const $=s=>document.querySelector(s),ph=$('#phone');
let S={wall:0,acc:'#3e91ff',shape:'50%',dark:1,h24:1,br:100,wifi:1,net:'Acasă-5G',pin:'',torch:0,bt:0,dnd:0,rot:0,sav:0,vol:60,tr:0,now:1,cols:4,isz:58,lbl:1,wid:1,c1:'#1d2b64',c2:'#f8cdda',inst:[],ic:{},gst:0,pack:0,anim:0,wcs:0,lcs:0,lpos:0,lcol:'#ffffff',ldt:1,lb:0,lmsg:'',bat:0,navi:0,sti:0,lw:0,wg:['wea'],dockc:'#ffffff',dockop:20,db:18};
try{Object.assign(S,JSON.parse(localStorage.novaos||'{}'))}catch(e){}
S.play=0;
const save=()=>{try{localStorage.novaos=JSON.stringify(S)}catch(e){}};
const W=['linear-gradient(160deg,#1d2b64,#f8cdda)','linear-gradient(160deg,#0f2027,#2c7a7b)','linear-gradient(160deg,#42275a,#734b6d)','linear-gradient(160deg,#f12711,#f5af19)','linear-gradient(160deg,#134e5e,#71b280)','linear-gradient(160deg,#000,#434343)'];
const ACC=['#3e91ff','#ff5a7a','#31c48d','#ffb020','#9b6bff','#18c5d6'];
const NETS=['Acasă-5G','Cafenea_Free','Vecinul_2.4','Birou-Guest'];
function apply(){const r=document.documentElement;r.style.setProperty('--acc',S.acc);r.style.setProperty('--r',S.shape);r.classList.toggle('light',!S.dark);
r.style.setProperty('--cols',S.cols);r.style.setProperty('--isz',S.isz+'px');ph.style.background=S.wall==6?'linear-gradient(160deg,'+S.c1+','+S.c2+')':W[S.wall];ph.classList.toggle('nl',!S.lbl);ph.classList.toggle('gst',!!S.gst);for(let i=0;i<5;i++)ph.classList.toggle('pk'+i,S.pack==i);for(let i=0;i<4;i++)ph.classList.toggle('an'+i,S.anim==i);ph.classList.toggle('wc1',S.wcs==1);r.style.setProperty('--dk',S.dockc+Math.round(S.dockop*2.55).toString(16).padStart(2,'0'));r.style.setProperty('--db',S.db+'px');const L=$('#lock');L.className='layer lk'+S.lcs+' lp'+S.lpos;L.style.color=S.lcol;L.style.backdropFilter=L.style.webkitBackdropFilter='blur('+S.lb+'px)';$('#ld').style.display=S.ldt?'':'none';$('#lock .h').textContent=S.lmsg||'Atinge pentru a debloca';$('.wid').style.display=S.wid?'':'none';nw();$('#dim').style.opacity=(100-S.br)/130;const NI=[['◀','⬤','▮▮▮'],['‹','○','|||'],['◁','◯','▢']][S.navi|0];build();$('#nb').textContent=NI[0];$('#nh').textContent=NI[1];$('#nr').textContent=NI[2];bat();const SI=[['📶','✈️'],['🛜','✈️'],['≋','✈']][S.sti|0];$('#sw').textContent=S.wifi?SI[0]:SI[1];const _x=S.wifi?'📶':'✈️';save();tiles()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,1800)}
function tick(){const d=new Date(),o={hour:'2-digit',minute:'2-digit',hour12:!S.h24},t=d.toLocaleTimeString('ro-RO',o).replace(/\s?(AM|PM)/i,' $1'),
ds=d.toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long'});
['sc','hc'].forEach(i=>$('#'+i).textContent=t);$('#lc').innerHTML=S.lcs==2?t.split(':').map(x=>'<div>'+x+'</div>').join(''):t;$('#lw').textContent=['','🔋 '+Math.round(BL.l*100)+'%','⛅ 18° București','📝 '+noteLine()][S.lw|0];widgets();['hd','ld'].forEach(i=>$('#'+i).textContent=ds)}
setInterval(tick,1000);
const BL={l:1,c:0};function bat(){const p=Math.round(BL.l*100),c=BL.l<.2?'#ff453a':BL.c?'#30d158':'#fff';$('#sb').innerHTML=[`${BL.c?'⚡':'🔋'} ${p}%`,`<span class="bt"><i style="width:${p}%;background:${c}"></i></span> ${p}%`,`${p}%`,`<svg width="16" height="16" viewBox="0 0 20 20" style="vertical-align:-3px"><circle cx="10" cy="10" r="8" fill="none" stroke="#fff4" stroke-width="3"/><circle cx="10" cy="10" r="8" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="${p*.503} 100" transform="rotate(-90 10 10)"/></svg> ${p}%`,`<span class="bt"><i style="width:${p}%;background:${c}"></i></span>`][S.bat|0]}
if(navigator.getBattery)navigator.getBattery().then(b=>{const f=()=>{BL.l=b.level;BL.c=b.charging;bat()};const f0=()=>$('#sb').textContent=(b.charging?'⚡':'🔋')+Math.round(b.level*100)+'%';f();b.onlevelchange=b.onchargingchange=f});else $('#sb').textContent='🔋100%';
/* lock */
let buf='';
function unlock(){$('#lock').style.transform='translateY(-100%)';$('#lock').style.pointerEvents='none';buf='';drawDots()}
function lock(){closeApp();$('#lock').style.transform='';$('#lock').style.pointerEvents='';$('#pinbox').classList.remove('on')}
function drawDots(){$('#dots').innerHTML=[0,1,2,3].map(i=>`<i class="${i<buf.length?'f':''}"></i>`).join('')}
$('#keys').innerHTML=[1,2,3,4,5,6,7,8,9,'✕',0,'⌫'].map(k=>`<b>${k}</b>`).join('');
$('#keys').onclick=e=>{const k=e.target.textContent;if(e.target.tagName!='B')return;
if(k=='✕'){$('#pinbox').classList.remove('on');buf='';}else if(k=='⌫')buf=buf.slice(0,-1);else if(buf.length<4)buf+=k;
drawDots();if(buf.length==4){if(buf==S.pin)unlock();else{toast('PIN greșit');buf='';setTimeout(drawDots,200)}}};
function lt(){S.pin?($('#pinbox').classList.add('on'),drawDots()):unlock()}
$('#lock').onclick=e=>{if(!e.target.closest('#pinbox,#nowbar'))lt()};
let ty;$('#lock').onpointerdown=e=>ty=e.clientY;$('#lock').onpointerup=e=>{if(ty-e.clientY>80)lt()};
$('#fp').onclick=()=>{S.pin='';buf='';save();$('#pinbox').classList.remove('on');drawDots();toast('PIN șters')};
/* quick settings */
function tiles(){$('#tiles').innerHTML=[['wifi','📶','Wi-Fi',S.wifi],['dark','🌙','Mod întunecat',S.dark],['torch','🔦','Lanternă',S.torch],['air','✈️','Avion',!S.wifi],['bt','🔵','Bluetooth',S.bt],['dnd','🔕','Nu deranja',S.dnd],['rot','🔄','Rotire auto',S.rot],['sav','🔋','Economisire',S.sav],['gst','👆','Gesturi',S.gst],['lck','🔒','Blochează',0],['pwr','⏻','Oprire',0]].map(t=>`<div class="tile ${t[3]?'on':''}" data-k="${t[0]}"><div>${t[1]}</div>${t[2]}</div>`).join('');$('#br').value=S.br}
$('#tiles').onclick=e=>{const k=e.target.closest('.tile')?.dataset.k;if(!k)return;
if(k=='pwr'){$('#qs').classList.remove('on');pmenu();return}if(k=='lck'){lock();$('#qs').classList.remove('on');return}if(k=='wifi'||k=='air')S.wifi=S.wifi?0:1;else if(['bt','gst','dnd','rot','sav'].includes(k))S[k]=S[k]?0:1;else if(k=='dark')S.dark=S.dark?0:1;else{S.torch=S.torch?0:1;ph.style.outline=S.torch?'0':'';toast(S.torch?'Lanternă pornită':'Lanternă oprită')}apply()};
$('#br').oninput=e=>{S.br=+e.target.value;apply()};
$('#status').onclick=()=>$('#qs').classList.toggle('on');
$('#phone').addEventListener('click',e=>{if(!e.target.closest('#qs,#status,#gzt'))$('#qs').classList.remove('on')},true);
/* apps */
const online=()=>S.wifi&&navigator.onLine!==false;
const A=[
{id:'set',n:'Setări',i:'⚙️',c:'#5b6272',f:settings},

()=>sel('anim','Deschidere aplicații',['Zoom','Glisare','Fade','Fără'])+tg('gst','Navigare cu gesturi'),
()=>sel('wcs','Ceas pe ecranul principal',['Clasic','Aldin cu accent'])+tg('wid','Widget ceas')+tg('h24','Format 24 de ore'),()=>sel('bat','Pictogramă baterie',['Emoji','Bară + %','Procent','Cerc','Doar bară'])+sel('navi','Butoane navigare',['Clasic','Subțire','Contur'])+sel('sti','Pictograme stare',['Standard','Modern','Simplu'])+`<div class="row"><div>Culoare dock</div></div><div class="chips">${['#ffffff',...ACC,'#000000'].map(c=>`<i data-dc="${c}" class="${S.dockc==c?'s':''}" style="background:${c}"></i>`).join('')}</div><div class="row"><div>Opacitate dock</div><input type="range" data-r="dockop" min="0" max="100" value="${S.dockop}" style="width:130px"></div><div class="row"><div>Blur dock</div><input type="range" data-r="db" min="0" max="30" value="${S.db}" style="width:130px"></div><div class="row"><div>Widgeturi<small>Ține apăsat pe ecranul principal ca să ajungi aici</small></div></div>`+[['wea','Vreme'],['bat','Baterie'],['cal','Calendar'],['not','Notiță'],['mus','Muzică']].map(w=>`<div class="row"><div>${w[1]}</div><div class="sw ${S.wg.includes(w[0])?'on':''}" data-w="${w[0]}"></div></div>`).join('')+sel('lw','Widget ecran blocat',['Niciunul','Baterie','Vreme','Notiță'])];
const draw=()=>{b.innerHTML=`<div class="chips">${tabs.map((x,i)=>`<button class="btn" data-g="${i}" style="${i==t?'':'background:#8886'}">${x}</button>`).join('')}</div><div class="card">${P[t]()}</div>`};draw();
b.onclick=e=>{const x=e.target;if(x.dataset.g!=null){t=+x.dataset.g;return draw()}if(x.dataset.t)S[x.dataset.t]=S[x.dataset.t]?0:1;else if(x.dataset.lc)S.lcol=x.dataset.lc;else if(x.dataset.dc)S.dockc=x.dataset.dc;else if(x.dataset.w){const w=x.dataset.w;S.wg=S.wg.includes(w)?S.wg.filter(y=>y!=w):[...S.wg,w]}else if(x.id=='ri')S.ic={};else if(x.id=='pv'){lock();return}else return;apply();build();tick();draw()};
b.onchange=e=>{const k=e.target.dataset.k;if(!k)return;S[k]=+e.target.value;apply();build();tick()};
b.oninput=e=>{const x=e.target;if(x.dataset.r){S[x.dataset.r]=+x.value;apply()}else if(x.id=='lm'){S.lmsg=x.value;apply()}}}
$('#gzb').addEventListener('pointerdown',()=>$('#pill').style.width='190px');$('#gzb').addEventListener('pointerup',()=>$('#pill').style.width='120px');
document.addEventListener('pointerdown',e=>{if(e.target.matches&&e.target.matches('input,textarea'))e.target.inputMode='none'},true);
let GLT=0,lt3;
function noteLine(){try{return(localStorage.novanote||'').split('\n')[0]||'Nicio notiță'}catch(e){return 'Nicio notiță'}}
function widgets(){const d=new Date(),p=Math.round(BL.l*100),n=noteLine().slice(0,40).replace(/</g,'&lt;');
const W2={wea:'<small>București</small><b>⛅ 18°</b><small>Parțial noros</small>',bat:`<small>Baterie</small><b>${BL.c?'⚡':'🔋'} ${p}%</b>`,cal:`<small>${d.toLocaleDateString('ro-RO',{weekday:'long'})}</small><b>${d.getDate()} ${d.toLocaleDateString('ro-RO',{month:'short'})}</b>`,not:`<small>Notiță</small><span>${n}</span>`,mus:`<small>${TR[S.tr][0]}</small><b data-mp="1" style="cursor:pointer">${S.play?'⏸':'▶'} Muzică</b>`};
$('#wg').innerHTML=(S.wg||[]).map(k=>`<div class="wc">${W2[k]||''}</div>`).join('')}
$('#wg').onclick=e=>{if(e.target.dataset.mp)setPlay(!S.play)};
$('#home').addEventListener('pointerdown',e=>{if(!e.target.closest('.ic'))lt3=setTimeout(()=>{if(!cur){GLT=4;open('gl')}},700)});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,()=>clearTimeout(lt3)));
$('#rc').onwheel=e=>{const l=$('#rc .rcl');if(l)l.scrollLeft+=e.deltaY};
if(!S.mig){S.lb=20;S.mig=1}
const gr=$('#grid');let gx=null;
function page(d){const n=document.querySelectorAll('.pg').length;HP=Math.max(0,Math.min(n-1,HP+d));const p=$('.pgs');if(p)p.style.transform='translateX(-'+HP*100+'%)';document.querySelectorAll('#dots2 i').forEach((x,i)=>x.classList.toggle('a',i==HP))}
gr.addEventListener('pointerdown',e=>{gx=e.clientX});
gr.addEventListener('pointerup',e=>{if(gx==null)return;const dx=e.clientX-gx;gx=null;if(Math.abs(dx)>45)page(dx<0?1:-1)});
gr.addEventListener('wheel',e=>{e.preventDefault();if(!gr.w){gr.w=1;setTimeout(()=>gr.w=0,350);page(e.deltaY>0||e.deltaX>0?1:-1)}},{passive:false});
const pb=document.createElement('div');pb.id='pwb';pb.title='Buton lateral: apăsare = blocare, lung = meniu oprire';pb.style.cssText='position:absolute;right:0;top:170px;width:8px;height:74px;border-radius:5px 0 0 5px;background:#ffffff70;z-index:130;cursor:pointer';ph.appendChild(pb);
const off=document.createElement('div');off.style.cssText='position:absolute;inset:0;z-index:120;background:#000;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:30px;font-weight:300';ph.appendChild(off);
let lt4=0,pwOn=1;
function shut(){closeApp();RC.length=0;setPlay(0);pwOn=0;off.innerHTML='<small style="opacity:.3;font-size:13px;position:absolute;bottom:30px">Telefon oprit. Apăsați butonul lateral.</small>';off.style.display='flex'}
function boot(){pwOn=1;off.style.display='flex';off.innerHTML='<div style="font-size:70px">⬡</div>NovaOS<div style="width:120px;height:4px;background:#fff3;border-radius:2px;overflow:hidden;margin-top:20px"><i style="display:block;height:100%;width:0;background:var(--acc);transition:width 1.6s linear"></i></div>';setTimeout(()=>off.querySelector('i').style.width='100%',40);setTimeout(()=>{off.style.display='none';lock()},1900)}
function pmenu(){if($('#pm'))return;const m=document.createElement('div');m.id='pm';m.style.cssText='position:absolute;inset:0;z-index:110;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px';m.innerHTML=['p1|⏻ Oprește|background:#e5484d','p2|🔄 Repornește|','p3|🔒 Blochează|background:#8886','p4|Anulează|background:#8886'].map(s=>{const a=s.split('|');return `<button class="btn" id="${a[0]}" style="width:210px;padding:14px;${a[2]}">${a[1]}</button>`}).join('');ph.appendChild(m);m.onclick=e=>{const i=e.target.id;if(!i)return;m.remove();if(i=='p1')shut();else if(i=='p2'){shut();setTimeout(boot,700)}else if(i=='p3')lock()}}
pb.onpointerdown=()=>{lt4=setTimeout(()=>{lt4=0;pmenu()},700)};
pb.onpointerup=()=>{if(lt4){clearTimeout(lt4);lt4=0;pwOn?lock():boot()}};pb.onpointerleave=()=>{clearTimeout(lt4);lt4=0};
A.find(a=>a.id=='clk').f=clock2;A.push({id:'gl',n:'Good Lock',i:'🔧',c:'#7c4dff',f:gl});
A.find(a=>a.id=='ph').f=phone;A.find(a=>a.id=='msg').f=msgs;A.find(a=>a.id=='wx').f=weather;
A.push({id:'ct',n:'Contacte',i:'👤',c:'#8e8e93',f:contacts},{id:'gal',n:'Galerie',i:'🖼️',c:'#ff2d55',f:gallery},{id:'map',n:'Hărți',i:'🗺️',c:'#34c759',f:stub('Hărți','Hartă demonstrativă: GPS-ul și internetul real nu sunt disponibile aici.')});build();
S.play=0;
apply();tick();

/* ===== PWA: buton Instaleaza OS + service worker ===== */
let dip=null;
const ib=document.createElement('div');ib.id='inst';ib.textContent='\u2b07 Instaleaz\u0103 OS';
ib.style.cssText='position:absolute;top:44px;right:14px;z-index:5;font-size:11px;padding:5px 11px;border-radius:14px;background:#ffffff26;backdrop-filter:blur(8px);color:#fff;cursor:pointer;opacity:.75';
$('#lock').appendChild(ib);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(standalone())ib.style.display='none';
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;ib.style.opacity=1});
window.addEventListener('appinstalled',()=>{ib.style.display='none';dip=null;toast('NovaOS instalat')});
ib.onpointerup=e=>e.stopPropagation();
ib.onclick=async e=>{e.stopPropagation();
if(dip){dip.prompt();const r=await dip.userChoice;if(r.outcome=='accepted')ib.style.display='none';dip=null}
else toast('Chrome: meniul \u22ee \u2192 Instaleaz\u0103 aplica\u021bia / Ad\u0103ug\u0103 pe ecranul principal')};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
